<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>shiki</title>
  <!-- Coolvetica isn't on Google Fonts so we use Bebas Neue which is nearly identical -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a060f;
      --purple: #9b5de5;
      --purple2: #c77dff;
      --purple3: #6a0dad;
      --text: #ede0ff;
      --muted: #7a6a8a;
      --glass: rgba(20, 8, 35, 0.75);
      --glass-border: rgba(155, 93, 229, 0.15);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      overflow-x: hidden;
      position: relative;
      background: var(--bg);
    }

    /* BG GIF — replace src with your gif */
    #bg-gif {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      filter: brightness(0.35) saturate(1.4);
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(10, 0, 20, 0.4);
      z-index: 1;
      pointer-events: none;
    }

    /* purple glow blob */
    body::before {
      content: '';
      position: fixed;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(155, 93, 229, 0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      pointer-events: none;
      animation: blobPulse 6s ease-in-out infinite;
    }

    @keyframes blobPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.7; }
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 400px;
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── HEADER: avatar left, name right ── */
    .header {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .avatar-wrap {
      position: relative;
      width: 80px;
      height: 80px;
      flex-shrink: 0;
    }

    .avatar-ring {
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(var(--purple), var(--purple2), var(--purple3), var(--purple));
      animation: spin 5s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .avatar-img {
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      object-fit: cover;
      width: calc(100% - 6px);
      height: calc(100% - 6px);
      background: #1a0a2e;
    }

    .avatar-fallback {
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: #1a0a2e;
      display: none;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      color: var(--purple);
    }

    .header-text { flex: 1; }

    .name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3rem;
      letter-spacing: 3px;
      line-height: 1;
      color: var(--text);
      text-shadow:
        0 0 20px rgba(155, 93, 229, 0.8),
        0 0 40px rgba(155, 93, 229, 0.4);
    }

    .tag {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 0.2rem;
    }

    /* ── DIVIDER ── */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--purple), transparent);
      opacity: 0.4;
    }

    /* ── LINKS - vertical stack ── */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.8rem 1.1rem;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 0.9rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
      position: relative;
      overflow: hidden;
    }

    .link-btn:hover {
      transform: scale(0.97);
      border-color: var(--purple);
      background: rgba(155, 93, 229, 0.08);
    }

    .link-btn .label {
      flex: 1;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 25px rgba(255,255,255,0.2);
    }

    .link-btn .icon {
      width: 34px; height: 34px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      background: rgba(155,93,229,0.15);
      display: flex; align-items: center; justify-content: center;
    }

    .link-btn .icon img {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .link-btn .icon svg {
      width: 18px; height: 18px;
      color: var(--purple2);
    }

    .link-btn .arrow {
      color: var(--muted);
      font-size: 0.9rem;
      transition: transform 0.2s, color 0.2s;
    }

    .link-btn:hover .arrow {
      transform: translateX(3px);
      color: var(--purple2);
    }

    /* ── MUSIC PLAYER ── */
    .player {
      width: 100%;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 1rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .player-top {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .player-art {
      width: 48px; height: 48px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--purple3), var(--purple2));
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .player-art img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .player-art svg { width: 22px; height: 22px; color: #fff; }
    .player-art.spinning { animation: discSpin 3s linear infinite; }
    @keyframes discSpin { to { transform: rotate(360deg); } }

    .player-info { flex: 1; min-width: 0; }

    .player-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: 1.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .player-artist {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }

    .play-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--purple), var(--purple2));
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s;
      box-shadow: 0 0 14px rgba(155,93,229,0.5);
    }

    .play-btn:hover { transform: scale(1.08); }
    .play-btn svg { width: 16px; height: 16px; }

    /* progress */
    .progress-wrap { display: flex; flex-direction: column; gap: 0.3rem; }

    .progress-bar-track {
      width: 100%;
      height: 4px;
      background: rgba(155,93,229,0.15);
      border-radius: 99px;
      cursor: pointer;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--purple), var(--purple2));
      width: 0%;
      pointer-events: none;
      transition: width 0.1s linear;
    }

    .progress-times {
      display: flex;
      justify-content: space-between;
      font-size: 0.62rem;
      color: var(--muted);
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }

    .ctrl-btn {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: none;
      background: rgba(155,93,229,0.12);
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, color 0.2s;
    }

    .ctrl-btn:hover { background: rgba(155,93,229,0.25); color: var(--purple2); }
    .ctrl-btn svg { width: 15px; height: 15px; }

    /* ── SONG CHANGER ── */
    .song-changer {
      width: 100%;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .song-changer-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: var(--purple2);
      text-transform: uppercase;
    }

    .song-changer-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .song-changer input[type="text"] {
      flex: 1;
      background: rgba(155,93,229,0.08);
      border: 1px solid rgba(155,93,229,0.2);
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      color: var(--text);
      font-size: 0.75rem;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }

    .song-changer input[type="text"]:focus {
      border-color: var(--purple);
    }

    .song-changer input[type="text"]::placeholder {
      color: var(--muted);
    }

    .song-changer-fields {
      display: flex;
      gap: 0.5rem;
    }

    .song-changer-fields input[type="text"] {
      flex: 1;
      background: rgba(155,93,229,0.08);
      border: 1px solid rgba(155,93,229,0.2);
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      color: var(--text);
      font-size: 0.75rem;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }

    .song-changer-fields input[type="text"]:focus {
      border-color: var(--purple);
    }

    .song-changer-fields input[type="text"]::placeholder { color: var(--muted); }

    .load-btn {
      padding: 0.45rem 0.9rem;
      background: linear-gradient(135deg, var(--purple3), var(--purple));
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .load-btn:hover { opacity: 0.85; }

    /* file upload */
    .upload-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .upload-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.8rem;
      background: rgba(155,93,229,0.08);
      border: 1px dashed rgba(155,93,229,0.3);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.72rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      flex: 1;
    }

    .upload-label:hover { border-color: var(--purple); color: var(--purple2); }
    .upload-label svg { width: 13px; height: 13px; flex-shrink: 0; }

    #file-input { display: none; }

    .or-divider {
      font-size: 0.65rem;
      color: var(--muted);
      text-align: center;
    }

    .footer {
      font-size: 0.6rem;
      color: rgba(200,150,255,0.2);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-family: 'Bebas Neue', sans-serif;
    }
  </style>
</head>

  <script>
    const audio     = document.getElementById('audio');
    const fill      = document.getElementById('fill');
    const curEl     = document.getElementById('cur');
    const durEl     = document.getElementById('dur');
    const iconPlay  = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');
    const disc      = document.getElementById('disc');

    function fmt(s) {
      if (isNaN(s)) return '0:00';
      return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`;
    }

    audio.addEventListener('loadedmetadata', () => { durEl.textContent = fmt(audio.duration); });
    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
      curEl.textContent = fmt(audio.currentTime);
    });
    audio.addEventListener('ended', () => {
      iconPlay.style.display = '';
      iconPause.style.display = 'none';
      disc.classList.remove('spinning');
    });

    // Scrubbing
    const track = document.getElementById('track');
    let scrubbing = false;

    function getScrubPos(e) {
      const rect = track.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      return Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    }

    function applyScrub(e) {
      if (!audio.duration) return;
      audio.currentTime = getScrubPos(e) * audio.duration;
    }

    track.addEventListener('mousedown',  e => { scrubbing = true; applyScrub(e); });
    track.addEventListener('touchstart', e => { scrubbing = true; applyScrub(e); }, { passive: true });
    window.addEventListener('mousemove',  e => { if (scrubbing) applyScrub(e); });
    window.addEventListener('touchmove',  e => { if (scrubbing) applyScrub(e); }, { passive: true });
    window.addEventListener('mouseup',   () => scrubbing = false);
    window.addEventListener('touchend',  () => scrubbing = false);

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        iconPlay.style.display = 'none';
        iconPause.style.display = '';
        disc.classList.add('spinning');
      } else {
        audio.pause();
        iconPlay.style.display = '';
        iconPause.style.display = 'none';
        disc.classList.remove('spinning');
      }
    }

    function skipBack()    { audio.currentTime = Math.max(0, audio.currentTime - 10); }
    function skipForward() { audio.currentTime = Math.min(audio.duration||0, audio.currentTime + 10); }

    // Autoplay
    window.addEventListener('load', () => {
      audio.play().then(() => {
        iconPlay.style.display = 'none';
        iconPause.style.display = '';
        disc.classList.add('spinning');
      }).catch(() => {});
    });

    // Change song via URL
    function loadURL() {
      const url    = document.getElementById('url-input').value.trim();
      const title  = document.getElementById('title-input').value.trim();
      const artist = document.getElementById('artist-input').value.trim();
      if (!url) return;
      setSong(url, title || 'Song Title', artist || 'Artist');
    }

    // Change song via file upload
    function loadFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const name = file.name.replace(/\.[^/.]+$/, '');
      setSong(url, name, 'Local File');
    }

    function setSong(url, title, artist) {
      const wasPlaying = !audio.paused;
      audio.pause();
      audio.src = url;
      document.getElementById('song-title').textContent  = title;
      document.getElementById('song-artist').textContent = artist;
      fill.style.width = '0%';
      curEl.textContent = '0:00';
      durEl.textContent = '0:00';
      audio.load();
      if (wasPlaying) {
        audio.play().then(() => {
          iconPlay.style.display = 'none';
          iconPause.style.display = '';
          disc.classList.add('spinning');
        }).catch(() => {});
      }
    }
  </script>

</body>
</html>
